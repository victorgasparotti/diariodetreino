<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-page">
    <div class="container auth-container">
        <form class="form-card vidro auth-card" method="post" action="{{ url_for('cadastro') }}">
            <h1>Criar conta</h1>
            <p class="cadastro-intro">
                Comece hoje: registre seus treinos, acompanhe seu progresso
                e avance um passo de cada vez rumo aos seus objetivos.
            </p>
            <div class="campo">
                <label for="nome_usuario">Nome de usuário</label>
                <input type="text" id="nome_usuario" name="nome_usuario" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
            </div>

            <div class="acoes">
                <button class="btn" type="submit">Criar conta</button>
                <a class="btn" href="{{ url_for('inicio') }}">Cancelar</a>
            </div>
        </form>
    </div>
</body>

</html>
