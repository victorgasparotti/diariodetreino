<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header class="topo vidro">
            <h1>{{ titulo }}</h1>
            <a class="btn" href="/cadastrar">+ Cadastrar</a>
        </header>

        {% for data, treino_do_dia in dias.items() %}
        <section class="dia vidro">
            <h2>{{ data }}</h2>
            <table>
                <thead>
                    <tr>
                        <th>Exercício</th>
                        <th>Séries</th>
                        <th>Repetições</th>
                        <th>Peso</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    {% for treino in treino_do_dia %}
                    <tr>
                        <td>{{ treino.exercicio }}</td>
                        <td>{{ treino.series }}</td>
                        <td>{{ treino.repeticoes }}</td>
                        <td>{{ treino.peso }} KG</td>
                        <td>
                            <form class="inline" method="post" action="{{ url_for('deletar', id=treino.id) }}">
                                <button class="btn btn-perigo" type="submit">Deletar</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </section>
        {% endfor %}
    </div>
</body>
</html>
